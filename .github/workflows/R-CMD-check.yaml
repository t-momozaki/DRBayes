# Runs R CMD check on the three platforms CRAN builds for, plus R-devel.
# Placed here rather than enabled: it starts running once the repository is
# pushed and Actions is switched on.
on:
  push:
    branches: [main]
  pull_request:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The tests that compare the compiled kernels with the R they replace
      # carry skip_on_cran(), and they are the ones worth running here.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          # cmdstanr is suggested and is not on CRAN. DESCRIPTION declares
          # Additional_repositories for R CMD check, which this action does not
          # read, so without this the dependency step cannot resolve it and
          # every job fails before it reaches the package.
          extra-repositories: https://stan-dev.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # The suggested packages are all installed, cmdstanr included: the
          # tests and vignettes need testthat, knitr and rmarkdown, so
          # restricting to hard dependencies would leave the check with
          # nothing to run. cmdstanr installs from the repository named above
          # and finds no CmdStan behind it, which is the case the package is
          # written to handle and the tests skip on.
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
